version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: inventory_canonical
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/engine/src/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory_canonical"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: inventory-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_dev_admin
      MINIO_ROOT_PASSWORD: minio_dev_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
